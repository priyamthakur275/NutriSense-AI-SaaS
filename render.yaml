services:
  - type: web
    name: nutrisense-ai
    env: python
    plan: free
    branch: main
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: NODE_VERSION
        value: "22.22.0"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://nutrisense-ai-x3cl.onrender.com"]'
      - key: AI_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDERS
        value: '["openai"]'
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
