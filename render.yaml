services:
  - type: web
    name: nutrisense-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutrisense-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: nutrisense-db
    plan: free
    databaseName: nutrisense
    user: nutrisense
